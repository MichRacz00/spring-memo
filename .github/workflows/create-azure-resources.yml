name: Provision Azure Infrastructure
description: This workflow is the "Big Bang" setup. It ensures that the target Resource Group (rg-memo-app) and all necessary dependencies exist before the application tries to deploy. It is idempotent, meaning you can run it multiple times; if resources already exist, it updates them (or skips creation) rather than failing or creating duplicates.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/**' # Run when infrastructure files change

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-memo-app
  APP_NAME: memo
  LOCATION: polandcentral
  
jobs:
  prerequisites:
    runs-on: ubuntu-latest
    outputs:
      ad_client_id: ${{ steps.output-vars.outputs.ad_client_id }}
      ad_client_secret: ${{ steps.output-vars.outputs.ad_client_secret }}
      docker_image: ${{ steps.docker.outputs.docker_image }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Docker Image Name
        id: docker
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          REPO_LC=${REPOSITORY,,} # Convert repository name to lowercase
          IMAGE_URL=ghcr.io/${REPO_LC}:latest
          echo "docker_image=$IMAGE_URL" >> $GITHUB_OUTPUT

      - name: Find Key Vault
        id: find-kv
        run: |
          KV_NAME=$(az keyvault list --resource-group ${{ env.RESOURCE_GROUP }} --query "[0].name" -o tsv || echo "")
          echo "kv_name=$KV_NAME" >> $GITHUB_OUTPUT

      - name: Purge Soft-Deleted Key Vault
        id: purge-kv
        run: |
          DELETED_NAME=$(az keyvault list-deleted --resource-type vault --query "[?starts_with(name, 'kv-${{ env.APP_NAME }}')].name" -o tsv | head -n 1)
          
          if [ -n "$DELETED_NAME" ]; then
            echo "⚠️ Found soft-deleted Key Vault: $DELETED_NAME"
            echo "Purging vault to allow fresh creation..."
            az keyvault purge --name $DELETED_NAME --location ${{ env.LOCATION }}
            echo "Waiting for purge to complete..."
            echo "purged=true" >> $GITHUB_OUTPUT
          else
            echo "purged=false" >> $GITHUB_OUTPUT
          fi

      # Needed to refresh login token (expires in 5-10 mins)
      - name: Azure Login (Refresh)
        uses: azure/login@v2
        if: steps.purge-kv.outputs.purged == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch Existing Secret
        id: fetch-secret
        if: steps.find-kv.outputs.kv_name != ''
        continue-on-error: true # Don't fail if secret is missing
        run: |
          SECRET=$(az keyvault secret show --vault-name ${{ steps.find-kv.outputs.kv_name }} --name "client-secret" --query value -o tsv)
          if [ -n "$SECRET" ]; then
            echo "::add-mask::$SECRET"
            echo "ad_client_secret=$SECRET" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Check App Registration
        id: check-app
        run: |
          APP_ID=$(az ad app list --display-name "${{ env.APP_NAME }}" --query "[0].appId" -o tsv)
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT

      - name: Create App Registration
        id: create-app
        if: steps.check-app.outputs.app_id == ''
        run: |
          echo "Creating new App Registration: ${{ env.APP_NAME }}"
          NEW_APP_ID=$(az ad app create --display-name "${{ env.APP_NAME }}" --query appId -o tsv)
          echo "app_id=$NEW_APP_ID" >> $GITHUB_OUTPUT

      # Run this if:
      # We didn't find a secret in KV
      # OR We just created a new App
      - name: Generate New Secret
        id: gen-secret
        if: steps.fetch-secret.outputs.found != 'true'
        run: |
          # Determine which App ID to use (Existing or Newly Created)
          FINAL_APP_ID="${{ steps.check-app.outputs.app_id }}"
          if [ -z "$FINAL_APP_ID" ]; then FINAL_APP_ID="${{ steps.create-app.outputs.app_id }}"; fi
          
          echo "Generating new secret for App ID: $FINAL_APP_ID"
          for i in {1..5}; do
            echo "Attempt $i..."
            NEW_SECRET=$(az ad app credential reset --id $FINAL_APP_ID --query password -o tsv) && break || sleep 10
          done
          
          # TODO: remove
          #echo "::add-mask::$NEW_SECRET"
          echo "Secret":
          echo $NEW_SECRET
          echo "ad_client_secret=$NEW_SECRET" >> $GITHUB_OUTPUT

      - name: Set Output Variables
        id: output-vars
        run: |
          if [ -n "${{ steps.check-app.outputs.app_id }}" ]; then
            echo "ad_client_id=${{ steps.check-app.outputs.app_id }}" >> $GITHUB_OUTPUT
          else
            echo "ad_client_id=${{ steps.create-app.outputs.app_id }}" >> $GITHUB_OUTPUT
          fi
          
          if [ "${{ steps.fetch-secret.outputs.found }}" == "true" ]; then
            SECRET="${{ steps.fetch-secret.outputs.ad_client_secret }}"
          else
            SECRET="${{ steps.gen-secret.outputs.ad_client_secret }}"
          fi
          
          # Safety Check
          if [ -z "$SECRET" ]; then
            echo "::error::Client Secret is empty! Neither fetch nor generation provided a value."
            exit 1
          fi
          
          echo "ad_client_secret=$SECRET" >> $GITHUB_OUTPUT
          # TODO: remove
          echo $SECRET

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: prerequisites
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
    
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Print Debug
        run: |
          echo "Client ID"
          echo ${{ needs.prerequisites.outputs.ad_client_id }}
          echo "Secret"
          echo ${{ needs.prerequisites.outputs.ad_client_secret }}

      - name: Deploy Infrastructure (Bicep)
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: ${{ env.LOCATION }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          template: ./infra/main.bicep
          deploymentName: main
          parameters: >
            appName=${{ env.APP_NAME }}
            containerImage=${{ needs.prerequisites.outputs.docker_image }}
            adClientId=${{ needs.prerequisites.outputs.ad_client_id }}
            adClientSecret=${{ needs.prerequisites.outputs.ad_client_secret }}
          failOnStdErr: false

      - name: Configure App Registration for Personal Accounts
        id: config-app
        run: |
          FINAL_APP_ID="${{ needs.prerequisites.outputs.ad_client_id }}"
          APP_OBJECT_ID=""
          
          for i in {1..5}; do
            echo "Attempt $i to get Object ID for AppID: $FINAL_APP_ID..."
            # Use --filter as it's more robust for Service Principals
            APP_OBJECT_ID=$(az ad app list --filter "appId eq '$FINAL_APP_ID'" --query "[0].id" -o tsv 2>/dev/null)
          
            if [ -n "$APP_OBJECT_ID" ]; then
              echo "Found Object ID: $APP_OBJECT_ID"
              break
            fi
          
            echo "Object ID not found yet. Sleeping 10s..."
            sleep 10
          done
          
          if [ -z "$APP_OBJECT_ID" ]; then
            echo "::error::Failed to resolve App Object ID for AppID: $FINAL_APP_ID"
            exit 1
          fi
          
          REDIRECT_URI="${{ steps.deploy.outputs.redirectUri }}/login/oauth2/code"
          
          echo $REDIRECT_URI
          
          az rest --method PATCH \
            --uri "https://graph.microsoft.com/v1.0/applications/$APP_OBJECT_ID" \
            --headers "Content-Type=application/json" \
            --body "{
                \"signInAudience\":\"AzureADandPersonalMicrosoftAccount\",
                \"api\":{\"requestedAccessTokenVersion\":2},
                \"web\": { \"redirectUris\": [\"$REDIRECT_URI\"] }
            }"
          
          echo "App Registration configured successfully."
