name: Enforce Version

on:
  pull_request:
    # Important: We need 'types' to re-run the check when a label is added/removed
    types: [opened, synchronize, labeled, unlabeled]
    branches:
      - main

jobs:
  enforce-version:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for required version label
        uses: yogevbd/enforce-label-action@2.1.0
        with:
          REQUIRED_LABEL_ANY_DESCRIPTION: "Please classify this PR's version impact by adding one label: 'patch' (for bug fixes), 'minor' (for new features), or 'major' (for breaking changes)."
          REQUIRED_LABELS_ANY_SINGLE: "major,minor,patch"
