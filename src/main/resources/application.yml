spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    azure:
      appconfiguration:
        stores:
          - endpoint: https://memo-config.azconfig.io
        enabled: true
      active-directory:
        enabled: true
        credential.client-id: 58efa4d5-62e8-4b3c-82ac-b0720c84f829
        profile.tenant-id: common
        post-logout-redirect-uri: http://localhost:8080
        authorization-clients:
          graph:
            scopes:
              - https://graph.microsoft.com/User.Read
      storage:
        blob:
          endpoint: https://memoblob.blob.core.windows.net/
        account-name: memoblob

keyvault.endpoint: https://memo-keyvault.vault.azure.net/

logging:
  level:
    com.azure.spring: DEBUG
    com.azure.data.appconfiguration: DEBUG
    root: INFO